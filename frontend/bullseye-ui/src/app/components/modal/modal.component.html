<div class="modal-backdrop" *ngIf="modalConfig" (click)="onBackdropClick($event)">
  <div class="modal-container" (click)="$event.stopPropagation()"
       [class.modal-success]="modalConfig.type === 'success'" 
       [class.modal-error]="modalConfig.type === 'error'"
       [class.modal-warning]="modalConfig.type === 'warning'">
    
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="modal-icon">
        <!-- Success Icon -->
        <svg *ngIf="modalConfig.type === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        
        <!-- Error Icon -->
        <svg *ngIf="modalConfig.type === 'error'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        
        <!-- Warning Icon -->
        <svg *ngIf="modalConfig.type === 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        
        <!-- Alert/Confirm Icon -->
        <svg *ngIf="modalConfig.type === 'alert' || modalConfig.type === 'confirm'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      
      <h3 class="modal-title">{{ modalConfig.title }}</h3>
      
      <button class="modal-close" (click)="close()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    
    <!-- Modal Body -->
    <div class="modal-body">
      <p class="modal-message" [innerHTML]="modalConfig.message.replace(/\n/g, '<br>')"></p>
    </div>
    
    <!-- Modal Footer -->
    <div class="modal-footer">
      <button *ngIf="modalConfig.type === 'confirm'" class="btn-cancel" (click)="onCancel(); $event.stopPropagation()">
        {{ modalConfig.cancelText || 'Cancel' }}
      </button>
      <button class="btn-confirm" (click)="onConfirm(); $event.stopPropagation()"
              [class.btn-success]="modalConfig.type === 'success'"
              [class.btn-error]="modalConfig.type === 'error'"
              [class.btn-warning]="modalConfig.type === 'warning'">
        {{ modalConfig.confirmText || 'OK' }}
      </button>
    </div>
    
  </div>
</div>
