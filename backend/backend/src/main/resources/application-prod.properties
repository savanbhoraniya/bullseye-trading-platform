spring.application.name=backend

# ===============================
# Database Configuration (Render PostgreSQL)
# ===============================
# DatabaseConfig.java handles the DATABASE_URL conversion from Render format
# No need to set spring.datasource.url here - it's configured programmatically

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# Cache Configuration
# ===============================
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

# ===============================
# Email Configuration (SMTP - Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# ===============================
# Scheduling Configuration
# ===============================
spring.task.scheduling.pool.size=2

# ===============================
# CORS Configuration (Allow Vercel Frontend)
# ===============================
# Add your Vercel URL here: https://your-app.vercel.app
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://bullseye-trading-platform.vercel.app}

# ===============================
# Logging Configuration
# ===============================
logging.level.root=INFO
logging.level.com.bullseye=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# ===============================
# Connection Pool Configuration
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
